<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPL 26-27 TOP5 내기</title>
<meta name="theme-color" content="#0B1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOP5 내기">
<style>
:root{
  --ink:#0B1420;
  --surface:#162334;
  --surface-2:#1F3049;
  --line:#2B3F59;
  --text:#EAF0F7;
  --muted:#8296AE;
  --gold:#F5BE4A;
  --cyan:#5CCBEC;
  --coral:#F0796E;
  --green:#5FD08A;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,'Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:15px;
  line-height:1.5;
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--ink) 74%,rgba(11,20,32,0));
  padding:calc(13px + env(safe-area-inset-top)) 16px 10px;
}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd-title{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0}
.hd-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.hd-meta b{color:var(--cyan);font-weight:700}

/* ---------- shell ---------- */
main{padding:0 16px;max-width:640px;margin:0 auto;overflow-wrap:break-word}
.view{display:none}
.view.on{display:block}
h2.sec{font-size:12.5px;font-weight:700;color:var(--muted);margin:20px 0 9px}

/* ---------- 현재 / 마감 예측 토글 ---------- */
.seg{
  display:flex;gap:4px;background:var(--surface);
  border-radius:12px;padding:4px;margin:4px 0 13px;
}
.seg button{
  flex:1;min-width:0;border:0;background:none;color:var(--muted);
  font:inherit;font-weight:700;font-size:13.5px;padding:9px 6px;
  border-radius:9px;cursor:pointer;
  transition:background .15s,color .15s;
}
.seg button.on{background:var(--surface-2);color:var(--text)}
.seg button.on[data-m="proj"]{background:rgba(92,203,236,.15);color:var(--cyan)}

/* ---------- 리더보드 ---------- */
.lb{display:flex;flex-direction:column;gap:9px}
.pl{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 13px 13px;
  cursor:pointer;
  display:block;width:100%;text-align:left;
  color:inherit;font:inherit;
}
.pl.first{
  border-color:rgba(245,190,74,.5);
  background:linear-gradient(158deg,#243550,#162334 62%);
  box-shadow:0 8px 26px -14px rgba(245,190,74,.55);
}
.pl-top{display:flex;align-items:center;gap:11px}
.rk{
  width:24px;flex:none;text-align:center;
  font-size:20px;font-weight:800;color:var(--muted);letter-spacing:-.03em;
}
.pl.first .rk{color:var(--gold)}
.pl-id{flex:1 1 0;min-width:0}
.pl-name{
  font-size:16.5px;font-weight:800;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-sub{
  font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-sub .up{color:var(--green);font-weight:700}
.pl-sub .dn{color:var(--coral);font-weight:700}
.pl-sub .win{color:var(--cyan);font-weight:700}
.pl-score{text-align:right;flex:none;line-height:1}
.sc{font-size:32px;font-weight:800;letter-spacing:-.04em}
.pl.first .sc{color:var(--gold)}
.sc-cap{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600}

/* 픽 칩 — 이 앱의 얼굴. 내가 찍은 5팀이 각각 몇 점 벌었는지 */
.strip{display:flex;gap:7px;margin-top:10px;min-width:0}
.chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.chip-i{
  width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;
  background:#fff;
  border:2px solid var(--tc,var(--line));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.chip-i img{width:70%;height:70%;object-fit:contain;display:block}
.chip-i .fb{font-size:9px;font-weight:800;color:#42536B;padding:0 2px;text-align:center;line-height:1.1}
.chip-p{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:-.02em}
/* 만점 팀 — 금색 링 */
.chip.p6 .chip-i{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,190,74,.14)}
.chip.p6 .chip-p{color:var(--gold)}
.chip.hit .chip-p{color:var(--text)}
/* 놓친 팀 — 채도만 뺀다.
   칩 전체에 opacity 를 걸면 흰 원까지 배경에 섞여 어느 팀인지 알아볼 수 없게 된다. */
.chip.miss .chip-i{border-color:var(--line);background:#DFE5ED}
.chip.miss img{filter:grayscale(.7)}

/* 펼친 내역 */
.bd{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.pl.open .bd{display:block}
.bd-r{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px}
.bd-pos{width:18px;color:var(--muted);font-weight:800;font-size:11.5px}
.bd-lg{width:19px;height:19px;flex:none;object-fit:contain}
.bd-tm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bd-act{color:var(--muted);font-size:11.5px;white-space:nowrap}
.bd-pt{width:30px;text-align:right;font-weight:800}
.bd-pt.z{color:var(--muted);font-weight:500}
.bd-sum{
  display:flex;justify-content:space-between;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
}

/* ---------- EPL 순위표 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  font-size:11px;font-weight:700;color:var(--muted);text-align:right;
  padding:0 0 8px;border-bottom:1px solid var(--line);
}
.tbl th:first-child,.tbl th:nth-child(2){text-align:left}
.tbl td{padding:8px 0;border-bottom:1px solid rgba(43,63,89,.45);text-align:right}
.tbl td:first-child,.tbl td:nth-child(2){text-align:left}
.tbl tr.top5 td{background:rgba(245,190,74,.05)}
.tbl tr.top5 td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.t-rk{width:24px;color:var(--muted);font-weight:800;padding-left:8px!important}
.tbl tr.top5 .t-rk{color:var(--gold)}
.t-tm{cursor:pointer}
.tm-row{display:flex;align-items:center;gap:9px}
.tlogo{width:23px;height:23px;flex:none;object-fit:contain}
/* 어두운 바탕에 그냥 두면 남색·진빨강 로고가 묻힌다. 흰 원 위에 올린다. */
.tlogo,.fx-lg,.bd-lg,.pr-lg{background:#fff;border-radius:50%;padding:2px}
.sheet-hd img{background:#fff;border-radius:50%;padding:3px}
.tm-nm{font-weight:700;letter-spacing:-.01em}
.t-pts{font-weight:800;width:34px}
.t-num{color:var(--muted);width:32px;font-size:13px}
.mv{font-size:11.5px;font-weight:800;width:34px}
.mv.u{color:var(--green)} .mv.d{color:var(--coral)} .mv.s{color:var(--muted);font-weight:600}
.t-prob{width:42px;font-weight:800;color:var(--cyan);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.bg{
  font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.bg.hit{background:rgba(245,190,74,.15);color:var(--gold);border-color:rgba(245,190,74,.38)}

/* ---------- 일정 ---------- */
.fx-day{font-size:12px;color:var(--muted);margin:16px 0 7px;font-weight:700}
.fx{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:9px 11px;margin-bottom:6px;font-size:13.5px;
}
.fx-t{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:7px}
.fx-t.r{justify-content:flex-end}
.fx-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-t.win span{font-weight:800}
.fx-lg{width:20px;height:20px;flex:none;object-fit:contain}
.fx-s{
  flex:none;font-weight:800;font-size:14px;min-width:48px;text-align:center;
  background:var(--surface-2);border-radius:7px;padding:3px 6px;
}
.fx-s.sched{background:transparent;color:var(--muted);font-weight:700;font-size:12.5px}
.fx.live{border-color:rgba(240,121,110,.5)}
.fx-s.now{background:rgba(240,121,110,.18);color:var(--coral)}
.sec.live-h{color:var(--coral)}
/* 다가올 경기 아래 줄 — 배당 · 맞대결 */
.fx{flex-wrap:wrap}
.fx-sub{
  flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:7px;padding-top:7px;border-top:1px dashed rgba(43,63,89,.7);
  font-size:11px;color:var(--muted);min-width:0;
}
.ods{display:flex;gap:4px;flex:none}
.od{background:var(--surface-2);border-radius:5px;padding:1px 6px;font-weight:700;color:var(--text)}
.od em{font-style:normal;font-weight:600;color:var(--muted);margin-right:3px}
.od.fav{color:var(--gold)}
.od.none{background:none;padding:1px 0;color:var(--muted);font-weight:600}
.h2h{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-src{text-align:right;font-size:10.5px;color:var(--muted);margin:6px 0 -12px;opacity:.85}
.live-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--coral);margin-right:5px;vertical-align:1px;
}

/* ---------- 확률 ---------- */
.prob{display:flex;flex-direction:column;gap:8px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.pr-top{display:flex;align-items:center;gap:9px}
.pr-lg{width:22px;height:22px;flex:none;object-fit:contain}
.pr-nm{flex:1;min-width:0;font-weight:800;font-size:14.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-v{font-weight:800;font-size:19px;color:var(--cyan);letter-spacing:-.02em}
.bar{height:6px;background:var(--surface-2);border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:4px}
.pr.lead{border-color:rgba(245,190,74,.45)}
.pr.lead .pr-v{color:var(--gold)}
.pr.lead .bar i{background:var(--gold)}
.pr-sub{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- 버튼 ---------- */
.run{
  display:block;width:100%;margin-top:4px;padding:13px;
  border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);
  font:inherit;font-weight:700;font-size:14.5px;letter-spacing:-.01em;
  cursor:pointer;transition:background .15s;
}
.run:active{background:var(--surface-2)}
.run:disabled{color:var(--muted);cursor:default}

/* ---------- 로딩 / 진행 ---------- */
.loading{text-align:center;padding:38px 16px;color:var(--muted);font-size:13.5px}
.loading b{color:var(--text);font-weight:700}
.prog{height:4px;background:var(--surface-2);border-radius:3px;margin:16px auto 0;max-width:210px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--cyan);border-radius:3px;transition:width .15s linear}

/* ---------- 팀 시트 ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(5,10,18,.74)}
.sheet.on{display:block}
.sheet-in{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;
  background:var(--ink);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;overflow-y:auto;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.sheet-hd{
  position:sticky;top:0;background:var(--ink);padding:16px 0 12px;
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);
}
.sheet-hd img{width:34px;height:34px;flex:none;object-fit:contain}
.sheet-hd h3{margin:0;font-size:18px;font-weight:800;flex:1;letter-spacing:-.02em}
.x{
  border:0;background:var(--surface-2);color:var(--text);
  width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;flex:none;line-height:1;
}
.sq{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(43,63,89,.4);font-size:13.5px}
.sq-j{width:23px;text-align:center;color:var(--muted);font-weight:800;font-size:12px;flex:none}
.sq-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-p{font-size:11px;color:var(--muted);flex:none}

/* ---------- 탭 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(17,29,44,.97);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(10px);
}
nav button{
  flex:1;min-width:0;border:0;background:none;color:var(--muted);
  font:inherit;font-size:11px;font-weight:700;
  height:var(--tabh);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
nav button.on{color:var(--gold)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.msg{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center;overflow-wrap:anywhere}
.msg.err{color:var(--coral)}
.msg button{
  display:block;margin:12px auto 0;padding:9px 17px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;
}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:13px 0 4px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <h1 class="hd-title">EPL 26-27 TOP5 내기</h1>
    <div class="hd-meta" id="meta">불러오는 중</div>
  </div>
</header>

<main>
  <section class="view on" id="v-lb">
    <div class="seg" id="lb-seg">
      <button data-m="now" class="on">현재 순위</button>
      <button data-m="proj">마감 예측</button>
    </div>
    <div id="lb-body"><div class="msg">순위를 불러오는 중입니다</div></div>
    <p class="note" id="lb-note"></p>
  </section>

  <section class="view" id="v-tbl">
    <div class="seg" id="tbl-seg">
      <button data-m="now" class="on">현재 순위</button>
      <button data-m="proj">마감 예측</button>
    </div>
    <div id="tbl-body"><div class="msg">순위를 불러오는 중입니다</div></div>
  </section>

  <section class="view" id="v-fx">
    <div id="fx-body"><div class="msg">일정 탭을 열면 불러옵니다</div></div>
  </section>

  <section class="view" id="v-fc">
    <div id="fc-body"><div class="msg">예측 탭을 열면 불러옵니다</div></div>
  </section>
</main>

<nav id="tabs">
  <button data-v="lb" class="on"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>리더보드</button>
  <button data-v="tbl"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>EPL 순위</button>
  <button data-v="fx"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>일정</button>
  <button data-v="fc"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 3h-5M21 3v5"/></svg>예측</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<script>
/* ============================================================
   1) 참가자 예측  —  여기만 고치면 앱 전체가 바뀝니다
   순서대로 1위, 2위, 3위, 4위, 5위 예측입니다.
   팀 이름은 한글 약칭/정식명/영문 아무거나 됩니다.
   ============================================================ */
const PREDICTIONS = [
  { name: "최현웅", picks: ["맨시티", "아스날", "첼시",   "토트넘", "브포"] },
  { name: "정윤성", picks: ["첼시",   "맨시티", "리버풀", "아스날", "맨유"] },
  { name: "류상준", picks: ["첼시",   "맨시티", "아스날", "토트넘", "리버풀"] },
  { name: "강응빈", picks: ["맨시티", "아스날", "첼시",   "토트넘", "맨유"] }
];

/* ============================================================
   2) 팀 이름 사전 (ESPN id 기준)
   ============================================================ */
/* c = 팀 브랜드 컬러. ESPN 제공값을 쓰되, 어두운 바탕에서 사라지는
   검정(뉴캐슬)·흰색(풀럼/리즈/토트넘) 팀은 알아볼 수 있게 보정했다. */
const TEAM_KO = {
  "349":{ko:"본머스",  c:"#E8332A",al:["본머스","AFC본머스","bournemouth"]},
  "359":{ko:"아스날",  c:"#F0283C",al:["아스날","아스널","arsenal"]},
  "362":{ko:"아스톤 빌라",s:"빌라",c:"#A81E57",al:["아스톤빌라","애스턴빌라","빌라","astonvilla","villa"]},
  "337":{ko:"브렌트포드",s:"브렌트",c:"#F5623C",al:["브렌트포드","브포","브렌포","brentford"]},
  "331":{ko:"브라이튼",c:"#2E7BEA",al:["브라이튼","brighton"]},
  "363":{ko:"첼시",    c:"#2F6FE0",al:["첼시","chelsea"]},
  "388":{ko:"코번트리",c:"#8CCDEE",al:["코번트리","코벤트리","coventry"]},
  "384":{ko:"크리스탈 팰리스",s:"팰리스",c:"#4A5FE8",al:["크리스탈팰리스","크리스탈팔라스","팰리스","crystalpalace","palace"]},
  "368":{ko:"에버턴",  c:"#4F86E8",al:["에버턴","에버튼","everton"]},
  "370":{ko:"풀럼",    c:"#DCE3EC",al:["풀럼","fulham"]},
  "306":{ko:"헐 시티",s:"헐",c:"#F59A22",al:["헐시티","헐","hullcity","hull"]},
  "373":{ko:"입스위치",c:"#3358D8",al:["입스위치","ipswich"]},

async function getJSON(url){
  const key = "eplbet:" + url;
  try{
    const hit = JSON.parse(sessionStorage.getItem(key) || "null");
    if (hit && Date.now() - hit.t < CFG.cacheTtlMs) return hit.d;
  }catch(e){}
  const res = await fetch(url);
  if (!res.ok) throw new Error("요청 실패 (" + res.status + ")");
  const d = await res.json();
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), d})); }catch(e){}
  return d;
}

  return (node.standings.entries || []).map(e => ({
    id: String(e.team.id),
    name: e.team.displayName,
    short: e.team.shortDisplayName || e.team.displayName,
    abbr: e.team.abbreviation || "",
    logo: (e.team.logos && e.team.logos[0]) ? e.team.logos[0].href : "",

   scoreboard: status 가 event 에, score 는 문자열
   team/schedule: status 가 competition 에, score 는 {value, displayValue} 객체
   두 형태를 모두 받는다. */
function evState(ev, comp){
  const st = (ev && ev.status) || (comp && comp.status) || {};
  return (st.type || {}).state || "pre";
}
function compScore(side){
  if (!side) return null;
  const s = side.score;
  if (s == null) return null;
  if (typeof s === "object") return s.value == null ? null : Number(s.value);
  return Number(s);
}

const DAY_MS = 86400000;
function sotOf(side){
  const s = ((side && side.statistics) || []).find(x => x.name === "shotsOnTarget");
  if (!s || s.displayValue == null || s.displayValue === "") return -1;
  const v = Number(s.displayValue);
  return Number.isFinite(v) ? v : -1;
}
// 미국식 배당 → 소수 배당.  "+135" → 2.35,  -330 → 1.30
function americanToDecimal(v){
  if (v == null) return null;
  const n = Number(String(v).replace("+", ""));
  if (!Number.isFinite(n) || n === 0) return null;
  return n > 0 ? 1 + n / 100 : 1 + 100 / -n;
}
/* scoreboard 의 odds[0]. 홈/원정은 moneyline.{home,away}.close(없으면 open), 무승부는 drawOdds.moneyLine.
   세 값이 다 있어야 쓴다. 확률은 내재확률 합으로 나눠 북메이커 마진을 걷어낸다.
   베팅 사이트 링크(link 필드)는 의도적으로 가져오지 않는다. */
function parseOdds(comp){
  const o = ((comp && comp.odds) || [])[0];
  if (!o) return null;
  const ml = o.moneyline || {};
  const line = side => {
    const x = ml[side] || {};
    const close = (x.close || {}).odds, open = (x.open || {}).odds;
    return close != null ? close : open;
  };
  const h = americanToDecimal(line("home"));
  const a = americanToDecimal(line("away"));
  const d = americanToDecimal((o.drawOdds || {}).moneyLine);
  if (!h || !d || !a) return null;
  const s = 1/h + 1/d + 1/a;
  return { h, d, a, pH: (1/h)/s, pD: (1/d)/s, pA: (1/a)/s, provider: (o.provider || {}).name || "" };
}
function parseEvents(events){
  const out = [];
  for (const ev of events){
    const c = ev.competitions[0];
    const home = c.competitors.find(x => x.homeAway === "home");
    const away = c.competitors.find(x => x.homeAway === "away");
    if (!home || !away) continue;
    let hs = sotOf(home), as = sotOf(away);
    if (hs === 0 && as === 0){ hs = -1; as = -1; }   // 0:0 은 기록 누락 (골이 난 경기도 0:0 으로 찍힌다)
    out.push({
      id: ev.id,
      date: ev.date,
      day: Math.floor(Date.parse(ev.date) / DAY_MS),   // UTC 기준 날짜 번호 (예측 모델의 시간 가중치)
      state: evState(ev, c),                // pre | in | post
      homeId: String(home.team.id),
      awayId: String(away.team.id),
      homeScore: compScore(home),
      awayScore: compScore(away),
      homeSot: hs,
      awaySot: as,
      odds: parseOdds(c)
    });
  }
  return out;
}

async function fetchAllFixtures(onStep){
  // 26-27 시즌 전체를 월 단위로 긁는다 (2026-08 ~ 2027-06)
  const months = [];
  for (let i = 0; i < 11; i++){
    months.push(ym(new Date(Date.UTC(2026, 7 + i, 1))));
  }
  let done = 0;
  const failed = [];
  const chunks = await Promise.all(months.map(async month => {
    const d = await getJSON(API + "/site/v2/sports/soccer/eng.1/scoreboard?dates=" + month)
      .catch(e => { failed.push(month + " " + e.message); return {events:[]}; });
    done++; if (onStep) onStep(done, months.length);
    return d.events || [];
  }));
  // 한 달이라도 못 받으면 일정에 구멍이 난 채로 예측까지 틀어진다.
  // 조용히 빈 화면을 내놓지 말고 이유를 드러낸다 (26-09: ESPN 이 날짜 형식을 바꿔 전부 400 이 났다).
  if (failed.length)
    throw new Error("ESPN 일정 " + failed.length + "/" + months.length +
                    "개월 응답 오류 — " + failed[0]);
  const seen = new Set();
  const out = parseEvents([].concat.apply([], chunks)).filter(f => {
    if (seen.has(f.id)) return false;
    seen.add(f.id);
    return true;
  });
  out.sort((a,b) => new Date(a.date) - new Date(b.date));
  if (!out.length) throw new Error("ESPN 이 26-27 시즌 경기를 하나도 주지 않았습니다");
  return out;
}

/* ============================================================
   5) 채점 — 스펙 확정 규칙
   팀 점수 = 실제 5위 안이면 3 + max(0, 3 - |예측순위 - 실제순위|), 아니면 0
   ============================================================ */
function teamPoints(predRank, actualRank){
  if (!actualRank || actualRank > 5) return 0;
  return 3 + Math.max(0, 3 - Math.abs(predRank - actualRank));
}
function scoreOne(player, rankOf){
  const rows = player.picks.map((teamId, i) => {
    const predRank = i + 1;
    const actualRank = rankOf[teamId] || null;
    return { teamId, predRank, actualRank, pts: teamPoints(predRank, actualRank) };
  });
  return {
    rows,
    total: rows.reduce((s,r) => s + r.pts, 0),
    exact: rows.filter(r => r.actualRank === r.predRank).length,
    inTop5: rows.filter(r => r.actualRank && r.actualRank <= 5).length
  };
}
function rankPlayers(scored){
  const arr = scored.slice().sort((a,b) =>
    b.total - a.total || b.exact - a.exact || b.inTop5 - a.inTop5 || a.name.localeCompare(b.name,"ko")
  );
  let rank = 0, prev = null;
  arr.forEach((p, i) => {
    const key = p.total + "/" + p.exact + "/" + p.inTop5;
    if (key !== prev){ rank = i + 1; prev = key; }
    p.rank = rank;
  });
  return arr;
}
const rankMapFrom = rows => {
  const m = {};
  rows.forEach(r => { m[r.id] = r.rank; });
  return m;
};

/* ============================================================
   6) 예측 — 공격·수비 포아송 모델 + 잔여일정 몬테카를로
   팀마다 공격력·수비력 두 값을 추정한다.
   직전 3시즌(HIST) + 올 시즌 경기를 '오래될수록 비중 절반'으로 함께 학습하므로
   시즌 초엔 전년 성적이, 경기가 쌓일수록 올 시즌 결과가 전력을 정한다.
   근거: 21-22 ~ 25-26 5시즌 백테스트에서 이전 Elo 방식보다
   최종 승점 오차 8.57 → 7.77, 경기 결과 로그손실 1.010 → 0.986 (5시즌 모두 개선).
   상대전적 가중은 같은 백테스트에서 5시즌 모두 예측을 악화시켜 넣지 않았다 (일정 탭에 표시만).
   ============================================================ */
let HIST_ROWS = null;
function histBySeason(){
  if (HIST_ROWS) return HIST_ROWS;
  HIST_ROWS = {};
  for (const y in HIST){
    HIST_ROWS[y] = HIST[y].split(";").map(s => {
      const v = s.split(",").map(Number);
      return { day:v[0], h:String(v[1]), a:String(v[2]), hg:v[3], ag:v[4], hs:v[5], as:v[6] };
    });
  }
  return HIST_ROWS;
}
const fixtureRow = f => ({ day:f.day, h:f.homeId, a:f.awayId,
  hg:f.homeScore, ag:f.awayScore, hs:f.homeSot, as:f.awaySot });

/* 가중 포아송 최대우도 (반복 비례 갱신).
   기대득점  홈 = exp(c + h + 공격[홈] - 수비[원정]),  원정 = exp(c + 공격[원정] - 수비[홈])
   prior = {팀id: [공격, 수비]} — 경기 수가 적은 팀은 이 값 쪽으로 당겨진다 (없으면 0 = 리그 평균) */
function fitStrength(rows, refDay, prior){
  const idSet = new Set(Object.keys(prior));
  rows.forEach(r => { idSet.add(r.h); idSet.add(r.a); });
  const ids = Array.from(idSet);
  const ix = {};
  ids.forEach((id, i) => { ix[id] = i; });
  const n = ids.length, m = rows.length;
  const H = new Int32Array(m), A = new Int32Array(m);
  const w = new Float64Array(m), hg = new Float64Array(m), ag = new Float64Array(m);

  // 학습 신호 = 실제 득점 × goalWeight + 유효슈팅을 득점으로 환산한 값 × (1 - goalWeight)
  let okGoals = 0, okShots = 0;
  rows.forEach(r => { if (r.hs >= 0 && r.as >= 0){ okGoals += r.hg + r.ag; okShots += r.hs + r.as; } });
  const ratio = okShots > 0 ? okGoals / okShots : 0;
  const gw = CFG.goalWeight;
  rows.forEach((r, i) => {
    H[i] = ix[r.h]; A[i] = ix[r.a];
    w[i] = Math.pow(0.5, (refDay - r.day) / CFG.halfLifeDays);
    const ok = r.hs >= 0 && r.as >= 0;
    hg[i] = ok ? gw * r.hg + (1 - gw) * ratio * r.hs : r.hg;
    ag[i] = ok ? gw * r.ag + (1 - gw) * ratio * r.as : r.ag;
  });

  let sw = 0, sg = 0;
  for (let i = 0; i < m; i++){ sw += w[i]; sg += w[i] * (hg[i] + ag[i]); }
  const base = sg / (2 * sw);
  const pa = new Float64Array(n), pd = new Float64Array(n);
  ids.forEach((id, i) => { if (prior[id]){ pa[i] = prior[id][0]; pd[i] = prior[id][1]; } });
  const a = Float64Array.from(pa), d = Float64Array.from(pd);
  let c = Math.log(base), h = 0.2;
  const tb = CFG.priorGames * base;
  const num = new Float64Array(n), den = new Float64Array(n);

  for (let it = 0; it < CFG.fitIters; it++){
    num.fill(0); den.fill(0);
    for (let i = 0; i < m; i++){
      num[H[i]] += w[i] * hg[i];
      num[A[i]] += w[i] * ag[i];
      den[H[i]] += w[i] * Math.exp(c + h - d[A[i]]);
      den[A[i]] += w[i] * Math.exp(c - d[H[i]]);
    }
    for (let k = 0; k < n; k++) a[k] = Math.log((num[k] + tb * Math.exp(pa[k])) / (den[k] + tb));

    num.fill(0); den.fill(0);
    for (let i = 0; i < m; i++){
      num[H[i]] += w[i] * ag[i];
      num[A[i]] += w[i] * hg[i];
      den[H[i]] += w[i] * Math.exp(c + a[A[i]]);
      den[A[i]] += w[i] * Math.exp(c + h + a[H[i]]);
    }
    for (let k = 0; k < n; k++) d[k] = -Math.log((num[k] + tb * Math.exp(-pd[k])) / (den[k] + tb));

    let s1 = 0, s2 = 0;
    for (let i = 0; i < m; i++){ s1 += w[i] * hg[i]; s2 += w[i] * Math.exp(c + a[H[i]] - d[A[i]]); }
    h = Math.log(s1 / s2);
    s1 = 0; s2 = 0;
    for (let i = 0; i < m; i++){
      s1 += w[i] * (hg[i] + ag[i]);
      s2 += w[i] * (Math.exp(h + a[H[i]] - d[A[i]]) + Math.exp(a[A[i]] - d[H[i]]));
    }
    c = Math.log(s1 / s2);
  }
  const strength = {};
  ids.forEach((id, i) => { strength[id] = { att:a[i], def:d[i] }; });
  return { strength, c, h };
}

function buildModel(current, fixtures){
  const hist = histBySeason();
  const histRows = Object.keys(hist).flatMap(y => hist[y]);
  const prevIds = new Set(hist[CFG.prevSeason].flatMap(r => [r.h, r.a]));
  const curIds = current.map(t => t.id);
  const played = fixtures.filter(f => f.state === "post" && f.homeScore != null && f.awayScore != null)
    .map(fixtureRow);
  const startDay = Math.min.apply(null, fixtures.map(f => f.day));

  // 승격팀은 올라온 첫 시즌의 전력을 모르므로, 직전 시즌 강등팀들의 평균 전력에서 출발한다
  const relegated = Array.from(prevIds).filter(id => curIds.indexOf(id) < 0);
  const promoted = curIds.filter(id => !prevIds.has(id));
  const prior = {};
  if (relegated.length){
    const pre = fitStrength(histRows, startDay, {});
    const avg = k => relegated.reduce((s, id) => s + pre.strength[id][k], 0) / relegated.length;
    const pAtt = avg("att"), pDef = avg("def");
    promoted.forEach(id => { prior[id] = [pAtt, pDef]; });
  }
  const refDay = played.length ? Math.max.apply(null, played.map(r => r.day)) : startDay;
  const fit = fitStrength(histRows.concat(played), refDay, prior);
  return Object.assign(fit, { promoted, relegated, played: played.length, refDay });
}

function expectedGoals(model, homeId, awayId){
  const s = model.strength, H = s[homeId], A = s[awayId];
  return [Math.exp(model.c + model.h + H.att - A.def), Math.exp(model.c + A.att - H.def)];
}

// 경기 하나의 홈승/무/원정승 확률 (0~10골 격자 합)
function matchProbs(model, homeId, awayId){
  const g = expectedGoals(model, homeId, awayId), lh = g[0], la = g[1];
  const ph = [], pa = [];
  let eh = Math.exp(-lh), ea = Math.exp(-la);
  for (let k = 0; k <= 10; k++){
    ph.push(eh); pa.push(ea);
    eh *= lh / (k + 1); ea *= la / (k + 1);
  }
  let pW = 0, pD = 0, pL = 0;
  for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++){
    const p = ph[i] * pa[j];
    if (i > j) pW += p; else if (i === j) pD += p; else pL += p;
  }
  const s = pW + pD + pL;
  return { pW: pW / s, pD: pD / s, pL: pL / s };
}

function sampleMargin(){
  const r = Math.random();
  return r < 0.52 ? 1 : (r < 0.83 ? 2 : 3);
}
// Box-Muller
let gaussSpare = null;
function gauss(){
  if (gaussSpare !== null){ const v = gaussSpare; gaussSpare = null; return v; }
  let u = 0, v = 0, s = 0;
  do { u = Math.random()*2-1; v = Math.random()*2-1; s = u*u + v*v; } while (s === 0 || s >= 1);
  const f = Math.sqrt(-2 * Math.log(s) / s);
  gaussSpare = v * f;
  return u * f;
}
// 포아송 난수 (역변환). 난수 하나로 누적확률을 따라 올라간다 — 경기당 기대득점 0~4 에서 가장 싸다.
function poisson(lam){
  const u = Math.random();
  let k = 0, p = Math.exp(-lam), F = p;
  while (u > F && k < 30){ k++; p *= lam / k; F += p; }
  return k;
}
/* 결과(0 홈승 / 1 무 / 2 원정승)가 배당으로 먼저 정해진 경기의 스코어.
   득실차 동률 판정에 쓰이므로, 모델 득점분포에서 그 결과가 나올 때까지 다시 뽑는다. */
function goalsFor(want, lh, la){
  for (let t = 0; t < 40; t++){
    const gh = poisson(lh), ga = poisson(la);
    const o = gh > ga ? 0 : (gh === ga ? 1 : 2);
    if (o === want) return [gh, ga];
  }
  const g = sampleMargin();
  return want === 0 ? [g, 0] : (want === 2 ? [0, g] : [1, 1]);
}

/* 경기가 진행 중일 때, 순위표가 그 경기를 이미 셈에 넣었는지 데이터로 판별한다.
   이미 반영됐는데 시뮬레이션에서 또 돌리면 같은 경기를 두 번 세게 된다.
   판정 근거: 리그 전체 '치른 경기 수'의 합은 경기 수의 두 배여야 한다. */
function liveAlreadyCounted(current, fixtures){
  const live = fixtures.filter(f => f.state === "in").length;
  if (!live) return false;
  const post = fixtures.filter(f => f.state === "post").length;
  const gpSum = current.reduce((s, t) => s + t.gp, 0);
  if (gpSum === (post + live) * 2) return true;   // 순위표가 진행 중 경기까지 셌다
  return false;                                    // 경기가 끝나야 반영된다
}

function simulate(current, fixtures, model, runs, onProgress, done){
  const ids = current.map(t => t.id);
  const n = ids.length;
  const idx = {};
  ids.forEach((id,i) => { idx[id] = i; });

  const basePts = new Float64Array(n);
  const baseGd  = new Float64Array(n);
  const baseGf  = new Float64Array(n);
  current.forEach(t => { basePts[idx[t.id]] = t.pts; baseGd[idx[t.id]] = t.gd; baseGf[idx[t.id]] = t.gf; });

  // 순위표가 진행 중 경기를 이미 반영했다면 그 경기는 다시 돌리지 않는다
  const skipLive = liveAlreadyCounted(current, fixtures);
  const rem = fixtures.filter(f =>
    f.state !== "post" && !(skipLive && f.state === "in") &&
    idx[f.homeId] !== undefined && idx[f.awayId] !== undefined);
  const R = rem.length;
  const remH = new Int32Array(R), remA = new Int32Array(R);
  const lamH = new Float64Array(R), lamA = new Float64Array(R);
  // 배당이 나온 경기는 결과를 시장 확률(마진 제거)로 뽑는다
  const useM = new Int32Array(R), mW = new Float64Array(R), mWD = new Float64Array(R);
  let oddsUsed = 0;
  rem.forEach((f,i) => {
    remH[i] = idx[f.homeId]; remA[i] = idx[f.awayId];
    const g = expectedGoals(model, f.homeId, f.awayId);
    lamH[i] = g[0]; lamA[i] = g[1];
    if (CFG.useOdds && f.odds && f.state === "pre"){
      useM[i] = 1; mW[i] = f.odds.pH; mWD[i] = f.odds.pH + f.odds.pD; oddsUsed++;
    }
  });

  // 남은 경기가 적을수록 팀 실력의 불확실성도 작아진다
  const maxGp = Math.max.apply(null, current.map(t => t.gp));
  const sd = CFG.strengthSdBase + CFG.strengthSdSpan * Math.max(0, 1 - maxGp / 38);
  const attM = new Float64Array(n), defM = new Float64Array(n);

  const rankSum   = new Float64Array(n);
  const ptsSum    = new Float64Array(n);
  const top5Count = new Float64Array(n);
  const rankHist  = Array.from({length:n}, () => new Float64Array(n + 1));
  const players   = PREDICTIONS.map(p => ({
    name: p.name,
    idxs: p.picks.map(id => idx[id]),
    sum: 0, wins: 0, hist: new Float64Array(31)
  }));

  const pts = new Float64Array(n), gd = new Float64Array(n), gf = new Float64Array(n);
  // 승점 > 골득실 > 득점 순서를 숫자 하나로 합쳐 두면 정렬이 훨씬 싸진다
  const key = new Float64Array(n);
  const order = new Int32Array(n);
  const rankOfIdx = new Int32Array(n);
  const CHUNK = 400;
  let run = 0;
  // 가장 뜨거운 루프(4,000런 × 남은 경기 × 2골)에서는 전역 조회를 피한다
  const rand = Math.random, mexp = Math.exp, gss = gauss;

  function step(){
    const stop = Math.min(run + CHUNK, runs);
    for (; run < stop; run++){
      pts.set(basePts); gd.set(baseGd); gf.set(baseGf);
      // 이번 시즌의 '진짜 실력'을 한 번 뽑는다 (런 내내 고정, 로그 스케일)
      for (let i = 0; i < n; i++){
        attM[i] = mexp(gss() * sd);
        defM[i] = mexp(-gss() * sd);
      }
      for (let i = 0; i < R; i++){
        const h = remH[i], a = remA[i];
        const lh = lamH[i] * attM[h] * defM[a];
        const la = lamA[i] * attM[a] * defM[h];
        let gh, ga;
        if (useM[i]){
          const r = rand();
          const g = goalsFor(r < mW[i] ? 0 : (r < mWD[i] ? 1 : 2), lh, la);
          gh = g[0]; ga = g[1];
        } else {
          // poisson() 두 번을 펼쳐 쓴 것 (역변환: 난수 하나로 누적확률을 따라 올라간다)
          let u = rand(), k = 0, p = mexp(-lh), F = p;
          while (u > F && k < 30){ k++; p *= lh / k; F += p; }
          gh = k;
          u = rand(); k = 0; p = mexp(-la); F = p;
          while (u > F && k < 30){ k++; p *= la / k; F += p; }
          ga = k;
        }
        gf[h] += gh; gf[a] += ga;
        gd[h] += gh - ga; gd[a] += ga - gh;
        if (gh > ga) pts[h] += 3;
        else if (gh < ga) pts[a] += 3;
        else { pts[h] += 1; pts[a] += 1; }
      }
      // 20팀뿐이라 비교 함수를 호출하는 sort 보다 삽입 정렬이 빠르다
      for (let i = 0; i < n; i++){
        key[i] = pts[i] * 1e7 + (gd[i] + 500) * 1e4 + gf[i];
        order[i] = i;
      }
      for (let i = 1; i < n; i++){
        const v = order[i], kv = key[v];
        let j = i - 1;
        while (j >= 0 && key[order[j]] < kv){ order[j+1] = order[j]; j--; }
        order[j+1] = v;
      }
      for (let r2 = 0; r2 < n; r2++){
        const ti = order[r2], rk = r2 + 1;
        rankOfIdx[ti] = rk;
        rankSum[ti] += rk;
        ptsSum[ti] += pts[ti];
        rankHist[ti][rk] += 1;
        if (rk <= 5) top5Count[ti] += 1;
      }
      let best = -1, tied = 0;
      for (let pi = 0; pi < players.length; pi++){
        const p = players[pi];
        let tot = 0;
        for (let k = 0; k < 5; k++) tot += teamPoints(k + 1, rankOfIdx[p.idxs[k]]);
        p.last = tot; p.sum += tot; p.hist[tot] += 1;
        if (tot > best){ best = tot; tied = 1; }
        else if (tot === best) tied++;
      }
      // 공동 1위는 승수를 나눠 갖는다
      for (let pi = 0; pi < players.length; pi++){
        if (players[pi].last === best) players[pi].wins += 1 / tied;
      }
    }
    if (onProgress) onProgress(run / runs);
    if (run < runs) setTimeout(step, 0);
    else {
      const teams = current.map(t => {
        const i = idx[t.id];
        let mode = 1, mv = -1;
        for (let r2 = 1; r2 <= n; r2++) if (rankHist[i][r2] > mv){ mv = rankHist[i][r2]; mode = r2; }
        return { id:t.id, expRank: rankSum[i]/runs, expPts: ptsSum[i]/runs,
                 top5: top5Count[i]/runs, modeRank: mode };
      });
      // 대표 시나리오 = 기대 승점으로 줄 세운 최종 순위표
      // (기대순위로 세우면 표에 함께 보이는 예상 승점과 순서가 어긋난다)
      const finalOrder = teams.slice().sort((a,b) => b.expPts - a.expPts || a.expRank - b.expRank);
      const projRank = {};
      finalOrder.forEach((t,i) => { projRank[t.id] = i + 1; });
      done({
        teams,
        projRank,
        remaining: R,                  // 실제로 시뮬레이션한 남은 경기 수
        oddsUsed,                      // 그중 배당 확률로 결과를 뽑은 경기 수
        strengthSd: sd,
        skippedLive: skipLive,
        players: players.map(p => ({
          name: p.name, avg: p.sum/runs, winPct: p.wins/runs, hist: Array.from(p.hist)
        }))
      });
    }
  }
  step();
}

const S = { cur:null, fixtures:null, fxAt:null, model:null, sim:null, byId:{}, unresolved:[],
            lbMode:'now', tblMode:'now', simAt:null };
const koName = id => (TEAM_KO[id] ? TEAM_KO[id].ko : ((S.byId[id] || {}).short || id));
const koShort = id => (TEAM_KO[id] ? (TEAM_KO[id].s || TEAM_KO[id].ko) : koName(id));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function resolveTeamId(input){
  const q = norm(input);
  for (const id in TEAM_KO) if (TEAM_KO[id].al.some(a => norm(a) === q)) return id;
  for (const id in S.byId){
    const t = S.byId[id];
    if (norm(t.name) === q || norm(t.short) === q || norm(t.abbr) === q) return id;
  }
  for (const id in TEAM_KO) if (TEAM_KO[id].al.some(a => norm(a).includes(q) || q.includes(norm(a)))) return id;
  return null;
}
function resolvePredictions(){
  S.unresolved = [];
  return PREDICTIONS.map(p => {
    const picks = p.picks.map(raw => {
      const id = resolveTeamId(raw);
      if (!id) S.unresolved.push(p.name + ": " + raw);
      return id;
    });
    return { name: p.name, picks, raw: p.picks };
  });
}

/* 한 번만 돌리고 결과를 재사용한다 */
let simPromise = null, simProgressCb = null;
function ensureSim(onProgress){
  if (S.sim) return Promise.resolve(S.sim);
  if (onProgress) simProgressCb = onProgress;
  if (!simPromise){
    simPromise = (async () => {
      const tick = f => { if (simProgressCb) simProgressCb(f); };
      if (!S.fixtures){
        S.fixtures = await fetchAllFixtures((a,b) => tick(a/b*0.3));
        S.fxAt = new Date();
      }
      S.model = buildModel(S.cur, S.fixtures);

      // 시뮬레이터는 팀 id 로 된 픽을 받는다. 끝나면 원래 이름으로 되돌린다.
      const players = resolvePredictions();
      const original = PREDICTIONS.map(p => p.picks);
      PREDICTIONS.forEach((p, i) => { p.picks = players[i].picks; });
      try{
        S.sim = await new Promise(res =>
          simulate(S.cur, S.fixtures, S.model, CFG.simRuns, f => tick(0.3 + f*0.7), res));
        S.simAt = new Date();
      } finally {
        PREDICTIONS.forEach((p, i) => { p.picks = original[i]; });
      }
      return S.sim;
    })();
    simPromise.catch(() => { simPromise = null; });
  }
  return simPromise;
}
function runWithSim(box, done){
  box.innerHTML =
    '<div class="loading"><b>마감 예측을 계산하는 중</b><br>' +
    '남은 경기를 ' + CFG.simRuns.toLocaleString() + '번 돌립니다' +
    '<div class="prog"><i></i></div></div>';
  const bar = box.querySelector(".prog i");
  ensureSim(f => { if (bar) bar.style.width = (f*100).toFixed(1) + "%"; })
    .then(done)
    .catch(e => {
      box.innerHTML = '<div class="msg err">예측을 계산하지 못했습니다 — ' + esc(e.message) + "</div>";
    });
}

}

/* 최근 맞대결 (홈팀 기준 승·무·패). 예측에는 쓰지 않고 참고로만 보여준다 —
   5시즌 백테스트에서 상대전적을 예측에 넣으면 5시즌 모두 오히려 더 틀렸다. */
function headToHead(homeId, awayId, limit){
  const pair = r => (r.h === homeId && r.a === awayId) || (r.h === awayId && r.a === homeId);
  const rows = [];
  const hist = histBySeason();
  for (const y in hist) for (const r of hist[y]) if (pair(r)) rows.push(r);
  (S.fixtures || []).forEach(f => {
    if (f.state === "post" && f.homeScore != null && f.awayScore != null){
      const r = fixtureRow(f);
      if (pair(r)) rows.push(r);
    }
  });
  rows.sort((x, y) => y.day - x.day);
  let w = 0, d = 0, l = 0;
  const last = rows.slice(0, limit);
  last.forEach(r => {
    const diff = r.h === homeId ? r.hg - r.ag : r.ag - r.hg;
    if (diff > 0) w++; else if (diff === 0) d++; else l++;
  });
  return { n: last.length, w, d, l };
}

function renderFixtures(){
  const live = S.fixtures.filter(f => f.state === "in");
  const past = S.fixtures.filter(f => f.state === "post").slice(-10).reverse();
  const next = S.fixtures.filter(f => f.state === "pre").slice(0, 20);

  // 다가올 경기 아래 줄: 소수 배당(가장 낮은 = 시장 예상 결과를 강조) + 최근 맞대결
  const subLine = f => {
    const o = f.odds;
    let odds;
    if (o){
      const fav = Math.min(o.h, o.d, o.a);
      const pill = (k, v) => '<span class="od' + (v === fav ? " fav" : "") + '"><em>' + k + "</em>" + v.toFixed(2) + "</span>";
      odds = '<span class="ods">' + pill("홈", o.h) + pill("무", o.d) + pill("원정", o.a) + "</span>";
    } else {
      odds = '<span class="ods"><span class="od none">배당 -</span></span>';
    }
    const r = headToHead(f.homeId, f.awayId, 5);
    const h2h = r.n
      ? '<span class="h2h">맞대결 ' + esc(koShort(f.homeId)) + " " + r.w + "승 " + r.d + "무 " + r.l + "패</span>"
      : "";
    return '<div class="fx-sub num">' + odds + h2h + "</div>";
  };

  const side = (id, right, win) =>
    '<div class="fx-t' + (right ? " r" : "") + (win ? " win" : "") + '">' +
    (right ? "<span>" + esc(koName(id)) + "</span>" + logoTag(id, "fx-lg")
           : logoTag(id, "fx-lg") + "<span>" + esc(koName(id)) + "</span>") + "</div>";

  const one = f => {
    const hasScore = f.homeScore != null && f.awayScore != null;
    if (f.state === "post" && hasScore){
      return '<div class="fx">' + side(f.homeId, true, f.homeScore > f.awayScore) +
        '<div class="fx-s num">' + f.homeScore + " : " + f.awayScore + "</div>" +
        side(f.awayId, false, f.awayScore > f.homeScore) + "</div>";
    }
    // 진행 중이면 시작 시각이 아니라 지금 스코어를 보여준다
    if (f.state === "in" && hasScore){
      return '<div class="fx live">' + side(f.homeId, true, false) +
        '<div class="fx-s now num">' + f.homeScore + " : " + f.awayScore + "</div>" +
        side(f.awayId, false, false) + "</div>";
    }
    const d = new Date(f.date);
    const hh = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    return '<div class="fx">' + side(f.homeId, true, false) +
      '<div class="fx-s sched num">' + hh + "</div>" +
      side(f.awayId, false, false) + subLine(f) + "</div>";
  };
  const group = list => {
    let out = "", day = "";
    for (const f of list){
      const d = new Date(f.date);
      const label = (d.getMonth()+1) + "월 " + d.getDate() + "일 " + "일월화수목금토"[d.getDay()] + "요일";
      if (label !== day){ out += '<div class="fx-day">' + label + "</div>"; day = label; }
      out += one(f);
    }
    return out || '<div class="msg">경기가 없습니다</div>';
  };
  // 배당 출처 — 탭 우측 상단에 작게
  const providers = Array.from(new Set(S.fixtures.filter(f => f.odds && f.odds.provider).map(f => f.odds.provider)));
  const src = providers.length
    ? '<div class="fx-src">배당 ' + esc(providers.join(", ")) + " · ESPN 경유" +
      (S.fxAt ? " · " + hhmm(S.fxAt) + " 기준" : "") + "</div>"
    : "";

  updateMeta();
  document.getElementById("fx-body").innerHTML = src +
    (live.length ? '<h2 class="sec live-h">지금 진행 중</h2>' + live.map(one).join("") : "") +
    '<h2 class="sec">다가올 경기</h2>' + group(next) +
    '<h2 class="sec">최근 결과</h2>' + group(past);
}

function renderForecast(){
  const box = document.getElementById("fc-body");
  if (!S.sim){ runWithSim(box, renderForecast); return; }

  const ps = S.sim.players.slice().sort((a,b) => b.winPct - a.winPct);
  const maxW = Math.max.apply(null, ps.map(p => p.winPct)) || 1;
  const winHtml = ps.map((p,i) =>
    '<div class="pr' + (i === 0 ? " lead" : "") + '">' +
      '<div class="pr-top"><div class="pr-nm">' + esc(p.name) + "</div>" +
      '<div class="pr-v num">' + (p.winPct*100).toFixed(1) + "%</div></div>" +
      '<div class="bar"><i style="width:' + (p.winPct/maxW*100).toFixed(1) + '%"></i></div>' +
      '<div class="pr-sub num">기대 점수 ' + p.avg.toFixed(1) + "점</div>" +
    "</div>"
  ).join("");

  const teams = S.sim.teams.slice().sort((a,b) => b.top5 - a.top5).slice(0, 10);
  const teamHtml = teams.map(t =>
    '<div class="pr"><div class="pr-top">' +
      logoTag(t.id, "pr-lg") + '<span class="fb" hidden></span>' +
      '<div class="pr-nm">' + esc(koName(t.id)) + "</div>" +
      '<div class="pr-v num">' + Math.round(t.top5*100) + "%</div></div>" +
      '<div class="bar"><i style="width:' + (t.top5*100).toFixed(1) + '%"></i></div>' +
      '<div class="pr-sub num">기대 순위 ' + t.expRank.toFixed(1) + "위 · 예상 승점 " +
        Math.round(t.expPts) + "</div>" +
    "</div>"
  ).join("");

  box.innerHTML =
    '<h2 class="sec">내기에서 1위 할 확률</h2><div class="prob">' + winHtml + "</div>" +
    '<p class="note">기대 점수가 높은 사람과 우승 확률이 높은 사람은 다를 수 있습니다. ' +
    '기대 점수는 ' + CFG.simRuns.toLocaleString() + '번의 <b>평균</b>이고, ' +
    '우승 확률은 그중 <b>실제로 1등한 횟수</b>입니다. ' +
    '드물게 터지는 픽은 평균을 끌어올리지만 매번 이기지는 못합니다. ' +
    '내기는 평균이 아니라 그 판의 최고점으로 가리므로 우승 확률 쪽이 실제 승부에 가깝습니다.</p>' +
    '<h2 class="sec">팀별 5위 안 진입 확률</h2><div class="prob">' + teamHtml + "</div>" +
    '<p class="note">직전 3시즌과 올 시즌 경기(득점·유효슈팅)로 팀별 공격력·수비력을 추정하고 ' +
    '(오래된 경기일수록 비중을 줄여 시즌이 흐를수록 올 시즌 결과가 커집니다), ' +
    '남은 경기를 ' + CFG.simRuns.toLocaleString() + '번 시뮬레이션한 결과입니다. ' +
    (S.sim.oddsUsed
      ? '배당이 나온 ' + S.sim.oddsUsed + '경기는 배당 확률로 결과를 뽑습니다 ' +
        '(과거 배당 자료가 없어 이 부분만은 백테스트로 검증하지 못했습니다). '
      : '') +
    '난수를 쓰기 때문에 다시 계산하면 숫자가 조금씩 달라집니다.' +
    (S.simAt ? " 마지막 계산 " + hhmm(S.simAt) + "." : "") + "</p>" +
    '<button class="run" id="recalc">최신 결과로 다시 계산</button>' +
    '<div class="prog" id="recalc-prog"><i></i></div>' +
    '<p class="note">주말 경기가 끝난 뒤 이 버튼을 누르면 앱을 닫지 않고도 ' +
    '최신 순위와 예측을 다시 받아옵니다.</p>';

  const btn = document.getElementById("recalc");
  if (btn) btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "다시 계산하는 중";
    const prog = document.getElementById("recalc-prog");
    const bar = prog ? prog.querySelector("i") : null;
    if (prog) prog.classList.add("on");
    try{
      await recalcAll(f => { if (bar) bar.style.width = (f*100).toFixed(1) + "%"; });
      renderForecast();
    }catch(e){
      btn.disabled = false;
      btn.textContent = "최신 결과로 다시 계산";
      if (prog) prog.classList.remove("on");
      alert("다시 계산하지 못했습니다 — " + e.message);
    }
  });
}

/* ============================================================
   13) 팀 시트
   ============================================================ */
async function openTeam(id){
  const sheet = document.getElementById("sheet");
  const box = document.getElementById("sheet-in");
  const head = () =>
    '<div class="sheet-hd">' + logoTag(id, "") + "<h3>" + esc(koName(id)) +
    '</h3><button class="x" id="x">×</button></div>';
  sheet.classList.add("on");
  box.innerHTML = head() + '<div class="msg">선수단을 불러오는 중</div>';
  const bindClose = () => {
    const b = document.getElementById("x");
    if (b) b.addEventListener("click", closeSheet);
  };
  bindClose();

  try{
    // 팀 일정 API 는 기본 호출이 '치른 경기'만 준다. 예정 경기는 fixture=true 로 따로 받는다.
    const schedUrl = API + "/site/v2/sports/soccer/eng.1/teams/" + id + "/schedule";
    const [rosterRaw, schedPast, schedNext] = await Promise.all([
      getJSON(API + "/site/v2/sports/soccer/eng.1/teams/" + id + "/roster"),
      getJSON(schedUrl).catch(() => ({events:[]})),
      getJSON(schedUrl + "?fixture=true").catch(() => ({events:[]}))
    ]);
    const groups = rosterRaw.athletes || [];
    const flat = groups.length && groups[0].items
      ? groups.flatMap(g => g.items.map(p => Object.assign({_g:g.position}, p)))
      : groups;
    const squad = flat.map(p =>
      '<div class="sq"><div class="sq-j num">' + esc(p.jersey || "-") + "</div>" +
      '<div class="sq-n">' + esc(p.displayName || p.fullName || "") + "</div>" +
      '<div class="sq-p num">' + esc(((p.position||{}).abbreviation) || "") +
        (p.age ? " · " + p.age + "세" : "") + "</div></div>"
    ).join("") || '<div class="msg">선수 정보가 없습니다</div>';

    // 시즌 전체 일정을 이미 받아 뒀으면 그걸 쓰고(예정 경기까지 보인다),
    // 아니면 팀 일정 API 결과를 쓴다. 여기서 실패해도 선수단은 보여야 한다.
    let rows = [];
    try{
      if (S.fixtures){
        const mine = S.fixtures.filter(f => f.homeId === id || f.awayId === id);
        const done = mine.filter(f => f.state === "post").slice(-3);
        const soon = mine.filter(f => f.state !== "post").slice(0, 4);
        rows = done.concat(soon).map(f => ({
          date: f.date, post: f.state === "post",
          h: f.homeId, a: f.awayId, hs: f.homeScore, as: f.awayScore
        }));
      } else {
        const toRow = ev => {
          const c = (ev.competitions || [])[0];
          if (!c) return null;
          const h = c.competitors.find(x => x.homeAway === "home");
          const a = c.competitors.find(x => x.homeAway === "away");
          if (!h || !a) return null;
          return {
            date: ev.date, post: evState(ev, c) === "post",
            h: String(h.team.id), a: String(a.team.id),
            hs: compScore(h), as: compScore(a)
          };
        };
        const past = (schedPast.events || []).map(toRow).filter(Boolean)
          .filter(r => r.post).slice(-3);
        const next = (schedNext.events || []).map(toRow).filter(Boolean)
          .filter(r => !r.post).slice(0, 4);
        rows = past.concat(next);
      }
    }catch(err){ rows = []; }

    const sched = rows.map(r => {
      const d = new Date(r.date);
      return '<div class="fx">' +
        '<div class="fx-t r"><span>' + esc(koName(r.h)) + "</span>" + logoTag(r.h, "fx-lg") + "</div>" +
        '<div class="fx-s' + (r.post ? "" : " sched") + ' num">' +
        (r.post ? r.hs + " : " + r.as : (d.getMonth()+1) + "/" + d.getDate()) + "</div>" +
        '<div class="fx-t">' + logoTag(r.a, "fx-lg") + "<span>" + esc(koName(r.a)) + "</span></div></div>";
    }).join("") || '<div class="msg">경기 정보가 없습니다</div>';

    box.innerHTML = head() +
      '<h2 class="sec">최근 · 예정 경기</h2>' + sched +
      '<h2 class="sec">선수단 ' + flat.length + "명</h2>" + squad;
    bindClose();
  }catch(e){
    box.insertAdjacentHTML("beforeend",
      '<div class="msg err">선수단을 불러오지 못했습니다 — ' + esc(e.message) + "</div>");
  }
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); }
document.getElementById("sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ============================================================
   14) 토글 · 탭
   ============================================================ */
function bindSeg(segId, key, redraw){
  const el = document.getElementById(segId);
  if (!el || !el.addEventListener) return;
  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || S[key] === b.dataset.m) return;
    S[key] = b.dataset.m;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    redraw();
  });
}
bindSeg("lb-seg", "lbMode", renderLeaderboard);
bindSeg("tbl-seg", "tblMode", renderTable);

let fxLoading = false;
/* 일정 데이터는 마감 예측 시뮬레이션도 쓴다.
   예측을 먼저 돌렸다면 이미 손에 있으므로 받아오지 말고 바로 그린다.
   (예전에는 "아직 없을 때만" 그리는 바람에, 예측을 먼저 본 경우 탭이 빈 채로 남았다) */
async function openFixtures(){
  const body = document.getElementById("fx-body");
  if (S.fixtures){ renderFixtures(); return; }
  if (fxLoading) return;
  fxLoading = true;
  body.innerHTML = '<div class="loading"><b>경기 일정을 불러오는 중</b></div>';
  try{
    S.fixtures = await fetchAllFixtures();
    S.fxAt = new Date();
    renderFixtures();
  }catch(err){
    body.innerHTML = '<div class="msg err">일정을 불러오지 못했습니다 — ' + esc(err.message) + "</div>";
  }
  fxLoading = false;
}

document.getElementById("tabs").addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.getElementById("v-" + btn.dataset.v).classList.add("on");
  window.scrollTo(0, 0);

  if (btn.dataset.v === "fx") openFixtures();
  if (btn.dataset.v === "fc") renderForecast();
});

/* ============================================================
   15) 부팅
   ============================================================ */
const hhmm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
function updateMeta(){
  const gp = Math.max.apply(null, S.cur.map(t => t.gp));
  const live = S.fixtures ? S.fixtures.filter(f => f.state === "in").length : 0;
  document.getElementById("meta").innerHTML =
    "<b>" + gp + "R</b> · " +
    (live ? '<span class="live-dot"></span>' + live + "경기 진행 중"
          : hhmm(new Date()) + " 기준");
}

/* 경기가 끝난 뒤 앱을 닫지 않고도 최신 결과를 반영한다.
   받아둔 응답 캐시까지 비워야 진짜 최신이 온다. */
async function recalcAll(onStep){
  try{
    for (const k of Object.keys(sessionStorage)){
      if (k.indexOf("eplbet:") === 0) sessionStorage.removeItem(k);
    }
  }catch(e){}
  S.sim = null; simPromise = null; simProgressCb = null;
  S.fixtures = null; S.fxAt = null; S.model = null;

  if (onStep) onStep(0.05);
  S.cur = await fetchStandings(CFG.season);
  S.cur.forEach(t => { S.byId[t.id] = t; });
  updateMeta();

  await ensureSim(f => { if (onStep) onStep(0.1 + f * 0.9); });
  updateMeta();
  renderLeaderboard();
  renderTable();
}

async function boot(){
  try{
    S.cur = await fetchStandings(CFG.season);
    S.cur.forEach(t => { S.byId[t.id] = t; });
    updateMeta();
    renderLeaderboard();
    renderTable();
  }catch(e){
    const isFile = location.protocol === "file:";
    const html = isFile
      ? '<div class="msg err">이 파일을 직접 열면 순위를 가져올 수 없습니다.' +
        '<br>브라우저 보안 정책 때문이며, 웹 주소(https://…)로 열면 정상 작동합니다.</div>'
      : '<div class="msg err">순위를 불러오지 못했습니다 — ' + esc(e.message) +
        '<button id="retry">다시 시도</button></div>';
    document.getElementById("lb-body").innerHTML = html;
    document.getElementById("meta").textContent = "연결 실패";
    const r = document.getElementById("retry");
    if (r) r.addEventListener("click", () => location.reload());
  }
}
boot();
</script>
