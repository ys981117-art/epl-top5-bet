<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPL 26-27 TOP5 내기</title>
<meta name="theme-color" content="#0D1826">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOP5 내기">
<style>
:root{
  --ink:#0D1826;
  --surface:#182838;
  --surface-2:#213448;
  --line:#2C4159;
  --text:#E6EDF5;
  --muted:#8798AD;
  --gold:#EFB23C;
  --cyan:#57C4E5;
  --coral:#E2736B;
  --green:#5FD08A;
  --r:10px;
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,'Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:15px;
  line-height:1.5;
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#0D1826 72%,rgba(13,24,38,0));
  /* 홈 화면에서 전체화면으로 뜰 때 노치·상태바와 겹치지 않게 */
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd-title{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.hd-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.hd-meta b{color:var(--cyan);font-weight:600}

/* ---------- shell ---------- */
main{padding:0 16px;max-width:640px;margin:0 auto;overflow-wrap:break-word}
html{overflow-x:hidden}
.view{display:none}
.view.on{display:block}
h2.sec{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:0}

/* ---------- leaderboard ---------- */
.lb{display:flex;flex-direction:column;gap:8px}
.pl{
  background:var(--surface);
  border:1px solid transparent;
  border-radius:var(--r);
  padding:12px 13px;
  cursor:pointer;
  display:block;width:100%;text-align:left;
  color:inherit;font:inherit;
}
.pl.first{border-color:rgba(239,178,60,.45);background:linear-gradient(180deg,#1F2D3C,#182838)}
.pl-top{display:flex;align-items:center;gap:11px}
.rk{
  width:26px;flex:none;text-align:center;
  font-size:19px;font-weight:800;color:var(--muted);
}
.pl.first .rk{color:var(--gold)}
.pl-id{flex:1 1 0;min-width:0}
.pl-name{
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-sub{font-size:11.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sub .up{color:var(--green)}
.pl-sub .dn{color:var(--coral)}
.pl-score{text-align:right;flex:none;line-height:1}
.sc-now{font-size:31px;font-weight:800;letter-spacing:-.03em}
.pl.first .sc-now{color:var(--gold)}
.sc-fin{font-size:12px;color:var(--cyan);margin-top:3px;font-weight:600}

/* pick strip — this app's fingerprint */
.strip{display:flex;gap:3px;margin-top:9px;min-width:0}
.cell{
  flex:1 1 0;min-width:0;height:22px;border-radius:4px;
  border:1px solid var(--line);
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;letter-spacing:-.03em;
  color:var(--muted);
  overflow:hidden;position:relative;
}
.cell i{position:absolute;inset:0;background:var(--gold);opacity:0;transition:opacity .18s}
.cell span{
  position:relative;z-index:1;max-width:100%;padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.cell[data-p="6"]{border-color:var(--gold);color:#10192A}
.cell[data-p="6"] i{opacity:1}
.cell[data-p="5"]{border-color:rgba(239,178,60,.8);color:#10192A}
.cell[data-p="5"] i{opacity:.78}
.cell[data-p="4"]{border-color:rgba(239,178,60,.6);color:var(--text)}
.cell[data-p="4"] i{opacity:.44}
.cell[data-p="3"]{border-color:rgba(239,178,60,.45);color:var(--text)}
.cell[data-p="3"] i{opacity:.2}
.cell[data-p="0"]{opacity:.5}

/* expanded breakdown */
.bd{display:none;margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.pl.open .bd{display:block}
.bd-r{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.bd-pos{width:20px;color:var(--muted);font-weight:700;font-size:12px}
.bd-tm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-act{color:var(--muted);font-size:12px;white-space:nowrap}
.bd-pt{width:34px;text-align:right;font-weight:700}
.bd-pt.z{color:var(--muted);font-weight:500}
.bd-sum{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  font-size:11px;font-weight:600;color:var(--muted);text-align:right;
  padding:0 0 7px;border-bottom:1px solid var(--line);
}
.tbl th:first-child,.tbl th:nth-child(2){text-align:left}
.tbl td{padding:9px 0;border-bottom:1px solid rgba(44,65,89,.5);text-align:right}
.tbl td:first-child,.tbl td:nth-child(2){text-align:left}
.tbl tr.top5 td{background:rgba(239,178,60,.055)}
.tbl tr.top5 td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
.t-rk{width:26px;color:var(--muted);font-weight:700;padding-left:7px!important}
.tbl tr.top5 .t-rk{color:var(--gold)}
.t-tm{cursor:pointer}
.t-tm b{font-weight:600}
.t-pts{font-weight:800;width:36px}
.t-num{color:var(--muted);width:30px;font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.bg{
  font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.bg.hit{background:rgba(239,178,60,.16);color:var(--gold);border-color:rgba(239,178,60,.4)}

/* ---------- fixtures ---------- */
.fx-day{font-size:12px;color:var(--muted);margin:16px 0 7px;font-weight:600}
.fx{
  display:flex;align-items:center;gap:9px;
  background:var(--surface);border-radius:var(--r);
  padding:9px 11px;margin-bottom:5px;font-size:13.5px;
}
.fx-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-t.r{text-align:right}
.fx-t.win{font-weight:700}
.fx-s{
  flex:none;font-weight:800;font-size:14px;min-width:46px;text-align:center;
  background:var(--surface-2);border-radius:5px;padding:2px 6px;
}
.fx-s.sched{background:transparent;color:var(--muted);font-weight:600;font-size:12.5px}

/* ---------- forecast ---------- */
.prob{display:flex;flex-direction:column;gap:7px}
.pr{background:var(--surface);border-radius:var(--r);padding:10px 12px}
.pr-top{display:flex;align-items:baseline;gap:8px}
.pr-nm{flex:1;font-weight:700;font-size:14.5px}
.pr-v{font-weight:800;font-size:18px;color:var(--cyan)}
.bar{height:5px;background:var(--surface-2);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:3px}
.pr.lead .pr-v{color:var(--gold)}
.pr.lead .bar i{background:var(--gold)}
.pr-sub{font-size:11.5px;color:var(--muted);margin-top:5px}

.run{
  width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:15px;
  cursor:pointer;
}
.run:disabled{color:var(--muted);cursor:default}
.prog{height:3px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--cyan);transition:width .12s linear}

/* ---------- team sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(6,12,20,.72);backdrop-filter:blur(3px);
}
.sheet.on{display:block}
.sheet-in{
  position:absolute;left:0;right:0;bottom:0;max-height:88vh;
  background:var(--ink);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;overflow-y:auto;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.sheet-hd{
  position:sticky;top:0;background:var(--ink);padding:15px 0 11px;
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);
}
.sheet-hd img{width:30px;height:30px;flex:none}
.sheet-hd h3{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.x{
  border:0;background:var(--surface-2);color:var(--text);
  width:29px;height:29px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;line-height:1;
}
.sq{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(44,65,89,.45);font-size:13.5px}
.sq-j{width:24px;text-align:center;color:var(--muted);font-weight:700;font-size:12px;flex:none}
.sq-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-p{font-size:11px;color:var(--muted);flex:none}

/* ---------- tabs ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(18,30,44,.97);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(8px);
}
nav button{
  flex:1;min-width:0;border:0;background:none;color:var(--muted);
  font:inherit;font-size:11px;font-weight:600;
  height:var(--tabh);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
nav button.on{color:var(--gold)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.msg{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center;overflow-wrap:anywhere}
.msg.err{color:var(--coral)}
.msg button{
  display:block;margin:11px auto 0;padding:8px 16px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer;
}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:12px 0 4px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <h1 class="hd-title">EPL 26-27 TOP5 내기</h1>
    <div class="hd-meta" id="meta">불러오는 중</div>
  </div>
</header>

<main>
  <section class="view on" id="v-lb">
    <div id="lb-body"><div class="msg">순위를 불러오는 중입니다</div></div>
    <p class="note" id="lb-note"></p>
  </section>

  <section class="view" id="v-tbl">
    <div id="tbl-body"><div class="msg">순위를 불러오는 중입니다</div></div>
  </section>

  <section class="view" id="v-fx">
    <div id="fx-body"><div class="msg">일정 탭을 열면 불러옵니다</div></div>
  </section>

  <section class="view" id="v-fc">
    <div id="fc-body"><div class="msg">예측 탭을 열면 불러옵니다</div></div>
  </section>
</main>

<nav id="tabs">
  <button data-v="lb" class="on"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>리더보드</button>
  <button data-v="tbl"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>EPL 순위</button>
  <button data-v="fx"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>일정</button>
  <button data-v="fc"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 3h-5M21 3v5"/></svg>예측</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<script>
/* ============================================================
   1) 참가자 예측  —  여기만 고치면 앱 전체가 바뀝니다
   순서대로 1위, 2위, 3위, 4위, 5위 예측입니다.
   팀 이름은 한글 약칭/정식명/영문 아무거나 됩니다.
   ============================================================ */
const PREDICTIONS = [
  { name: "최현웅", picks: ["맨시티", "아스날", "첼시",   "토트넘", "브포"] },
  { name: "정윤성", picks: ["첼시",   "맨시티", "리버풀", "아스날", "맨유"] },
  { name: "류상준", picks: ["첼시",   "맨시티", "아스날", "토트넘", "리버풀"] },
  { name: "강응빈", picks: ["맨시티", "아스날", "첼시",   "토트넘", "맨유"] }
];

/* ============================================================
   2) 팀 이름 사전 (ESPN id 기준)
   ============================================================ */
const TEAM_KO = {
  "349":{ko:"본머스",  al:["본머스","AFC본머스","bournemouth"]},
  "359":{ko:"아스날",  al:["아스날","아스널","arsenal"]},
  "362":{ko:"아스톤 빌라",s:"빌라",al:["아스톤빌라","애스턴빌라","빌라","astonvilla","villa"]},
  "337":{ko:"브렌트포드",s:"브렌트",al:["브렌트포드","브포","브렌포","brentford"]},
  "331":{ko:"브라이튼",al:["브라이튼","brighton"]},
  "363":{ko:"첼시",    al:["첼시","chelsea"]},
  "388":{ko:"코번트리",al:["코번트리","코벤트리","coventry"]},
  "384":{ko:"크리스탈 팰리스",s:"팰리스",al:["크리스탈팰리스","크리스탈팔라스","팰리스","crystalpalace","palace"]},
  "368":{ko:"에버턴",  al:["에버턴","에버튼","everton"]},
  "370":{ko:"풀럼",    al:["풀럼","fulham"]},
  "306":{ko:"헐 시티",s:"헐",al:["헐시티","헐","hullcity","hull"]},
  "373":{ko:"입스위치",al:["입스위치","ipswich"]},
  "357":{ko:"리즈",    al:["리즈","리즈유나이티드","leeds"]},
  "364":{ko:"리버풀",  al:["리버풀","리풀","liverpool"]},
  "382":{ko:"맨시티",  al:["맨시티","맨체스터시티","맨씨티","mancity","manchestercity"]},
  "360":{ko:"맨유",    al:["맨유","맨체스터유나이티드","맨유나이티드","manutd","manunited","manchesterunited"]},
  "361":{ko:"뉴캐슬",  al:["뉴캐슬","뉴캐","newcastle"]},
  "393":{ko:"노팅엄",  al:["노팅엄","노포","노팅엄포레스트","포레스트","nottinghamforest","forest"]},
  "366":{ko:"선덜랜드",al:["선덜랜드","sunderland"]},
  "367":{ko:"토트넘",  al:["토트넘","스퍼스","tottenham","spurs"]}
};

/* ============================================================
   3) 설정
   ============================================================ */
const CFG = {
  season: "2026",          // 26-27 시즌
  prevSeason: "2025",      // 25-26 시즌 (Elo 초기값)
  simRuns: 10000,
  eloPerPoint: 7.5,        // 전시즌 승점 1점당 Elo
  promotedElo: 1400,       // 승격팀 기본 Elo
  homeAdv: 65,             // 홈 어드밴티지 (Elo)
  kFactor: 20,
  // 팀 실력 자체의 불확실성(부상·이적·폼). 시즌이 진행될수록 줄어든다.
  strengthSdBase: 20,
  strengthSdSpan: 60,
  cacheTtlMs: 5 * 60 * 1000
};
const API = "https://site.api.espn.com/apis";
const norm = s => String(s).toLowerCase().replace(/[\s.\-'&]/g, "");

/* ============================================================
   4) 네트워크 (세션 캐시)
   ============================================================ */
async function getJSON(url){
  const key = "eplbet:" + url;
  try{
    const hit = JSON.parse(sessionStorage.getItem(key) || "null");
    if (hit && Date.now() - hit.t < CFG.cacheTtlMs) return hit.d;
  }catch(e){}
  const res = await fetch(url);
  if (!res.ok) throw new Error("요청 실패 (" + res.status + ")");
  const d = await res.json();
  try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(), d})); }catch(e){}
  return d;
}
const statVal = (stats, k) => {
  const s = (stats || []).find(x => x.name === k);
  return s ? Number(s.value) : 0;
};
function parseStandings(raw){
  const node = (raw.children || []).find(c => (c.standings || {}).entries) || raw.children[0];
  return (node.standings.entries || []).map(e => ({
    id: String(e.team.id),
    name: e.team.displayName,
    short: e.team.shortDisplayName || e.team.displayName,
    abbr: e.team.abbreviation || "",
    logo: (e.team.logos && e.team.logos[0]) ? e.team.logos[0].href : "",
    rank: statVal(e.stats,"rank"),
    pts: statVal(e.stats,"points"),
    gp: statVal(e.stats,"gamesPlayed"),
    w: statVal(e.stats,"wins"),
    d: statVal(e.stats,"ties"),
    l: statVal(e.stats,"losses"),
    gf: statVal(e.stats,"pointsFor"),
    ga: statVal(e.stats,"pointsAgainst"),
    gd: statVal(e.stats,"pointDifferential")
  })).sort((a,b) => a.rank - b.rank);
}
const fetchStandings = season =>
  getJSON(API + "/v2/sports/soccer/eng.1/standings?season=" + season).then(parseStandings);

const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");

/* ESPN 은 엔드포인트마다 경기 응답 모양이 다르다.
   scoreboard: status 가 event 에, score 는 문자열
   team/schedule: status 가 competition 에, score 는 {value, displayValue} 객체
   두 형태를 모두 받는다. */
function evState(ev, comp){
  const st = (ev && ev.status) || (comp && comp.status) || {};
  return (st.type || {}).state || "pre";
}
function compScore(side){
  if (!side) return null;
  const s = side.score;
  if (s == null) return null;
  if (typeof s === "object") return s.value == null ? null : Number(s.value);
  return Number(s);
}

async function fetchAllFixtures(onStep){
  // 26-27 시즌 전체를 월 단위로 긁는다 (2026-08 ~ 2027-06)
  const months = [];
  for (let i = 0; i < 11; i++){
    const from = new Date(Date.UTC(2026, 7 + i, 1));
    const to   = new Date(Date.UTC(2026, 8 + i, 0));
    months.push(ymd(from) + "-" + ymd(to));
  }
  const out = [], seen = new Set();
  let done = 0;
  const chunks = await Promise.all(months.map(async range => {
    const d = await getJSON(API + "/site/v2/sports/soccer/eng.1/scoreboard?dates=" + range)
      .catch(() => ({events:[]}));
    done++; if (onStep) onStep(done, months.length);
    return d.events || [];
  }));
  for (const evs of chunks){
    for (const ev of evs){
      if (seen.has(ev.id)) continue;
      seen.add(ev.id);
      const c = ev.competitions[0];
      const home = c.competitors.find(x => x.homeAway === "home");
      const away = c.competitors.find(x => x.homeAway === "away");
      if (!home || !away) continue;
      out.push({
        id: ev.id,
        date: ev.date,
        state: evState(ev, c),                // pre | in | post
        homeId: String(home.team.id),
        awayId: String(away.team.id),
        homeScore: compScore(home),
        awayScore: compScore(away)
      });
    }
  }
  out.sort((a,b) => new Date(a.date) - new Date(b.date));
  return out;
}

/* ============================================================
   5) 채점 — 스펙 확정 규칙
   팀 점수 = 실제 5위 안이면 3 + max(0, 3 - |예측순위 - 실제순위|), 아니면 0
   ============================================================ */
function teamPoints(predRank, actualRank){
  if (!actualRank || actualRank > 5) return 0;
  return 3 + Math.max(0, 3 - Math.abs(predRank - actualRank));
}
function scoreOne(player, rankOf){
  const rows = player.picks.map((teamId, i) => {
    const predRank = i + 1;
    const actualRank = rankOf[teamId] || null;
    return { teamId, predRank, actualRank, pts: teamPoints(predRank, actualRank) };
  });
  return {
    rows,
    total: rows.reduce((s,r) => s + r.pts, 0),
    exact: rows.filter(r => r.actualRank === r.predRank).length,
    inTop5: rows.filter(r => r.actualRank && r.actualRank <= 5).length
  };
}
function rankPlayers(scored){
  const arr = scored.slice().sort((a,b) =>
    b.total - a.total || b.exact - a.exact || b.inTop5 - a.inTop5 || a.name.localeCompare(b.name,"ko")
  );
  let rank = 0, prev = null;
  arr.forEach((p, i) => {
    const key = p.total + "/" + p.exact + "/" + p.inTop5;
    if (key !== prev){ rank = i + 1; prev = key; }
    p.rank = rank;
  });
  return arr;
}
const rankMapFrom = rows => {
  const m = {};
  rows.forEach(r => { m[r.id] = r.rank; });
  return m;
};

/* ============================================================
   6) 예측 — Elo + 잔여일정 몬테카를로
   ============================================================ */
function buildElo(prev, current){
  const prevPts = {};
  prev.forEach(t => { prevPts[t.id] = t.pts; });
  const vals = prev.map(t => t.pts);
  const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
  const elo = {};
  current.forEach(t => {
    elo[t.id] = (prevPts[t.id] === undefined)
      ? CFG.promotedElo
      : 1500 + (prevPts[t.id] - mean) * CFG.eloPerPoint;
  });
  return elo;
}
function applyPlayedMatches(elo, fixtures){
  for (const f of fixtures){
    if (f.state !== "post" || f.homeScore == null) continue;
    if (elo[f.homeId] === undefined || elo[f.awayId] === undefined) continue;
    const exp = 1 / (1 + Math.pow(10, (elo[f.awayId] - (elo[f.homeId] + CFG.homeAdv)) / 400));
    const act = f.homeScore > f.awayScore ? 1 : (f.homeScore === f.awayScore ? 0.5 : 0);
    const delta = CFG.kFactor * (act - exp);
    elo[f.homeId] += delta;
    elo[f.awayId] -= delta;
  }
  return elo;
}
function matchProbs(eloH, eloA){
  const dr = (eloH + CFG.homeAdv) - eloA;
  const e = 1 / (1 + Math.pow(10, -dr / 400));
  const pD = 0.27 * Math.exp(-Math.pow(dr / 300, 2));
  let pW = e - pD / 2;
  let pL = 1 - pW - pD;
  if (pW < 0){ pW = 0; pL = 1 - pD; }
  if (pL < 0){ pL = 0; pW = 1 - pD; }
  return { pW, pD, pL };
}
function sampleMargin(){
  const r = Math.random();
  return r < 0.52 ? 1 : (r < 0.83 ? 2 : 3);
}
// Elo 차이 -> 승/무 누적확률 룩업표. 매 시뮬마다 10의 거듭제곱을 다시 계산하지 않기 위함.
const TBL_MIN = -800, TBL_STEP = 2, TBL_N = 801;
const TBL_W = new Float64Array(TBL_N), TBL_WD = new Float64Array(TBL_N);
for (let i = 0; i < TBL_N; i++){
  const dr = TBL_MIN + i * TBL_STEP;
  const e = 1 / (1 + Math.pow(10, -dr / 400));
  const pD = 0.27 * Math.exp(-Math.pow(dr / 300, 2));
  let pW = e - pD / 2;
  if (pW < 0) pW = 0;
  if (pW + pD > 1) pW = 1 - pD;
  TBL_W[i] = pW;
  TBL_WD[i] = pW + pD;
}
const drIndex = dr => {
  const i = ((dr - TBL_MIN) / TBL_STEP) | 0;
  return i < 0 ? 0 : (i >= TBL_N ? TBL_N - 1 : i);
};
// Box-Muller
let gaussSpare = null;
function gauss(){
  if (gaussSpare !== null){ const v = gaussSpare; gaussSpare = null; return v; }
  let u = 0, v = 0, s = 0;
  do { u = Math.random()*2-1; v = Math.random()*2-1; s = u*u + v*v; } while (s === 0 || s >= 1);
  const f = Math.sqrt(-2 * Math.log(s) / s);
  gaussSpare = v * f;
  return u * f;
}
function simulate(current, fixtures, elo, runs, onProgress, done){
  const ids = current.map(t => t.id);
  const n = ids.length;
  const idx = {};
  ids.forEach((id,i) => { idx[id] = i; });

  const basePts = new Float64Array(n);
  const baseGd  = new Float64Array(n);
  const baseGf  = new Float64Array(n);
  current.forEach(t => { basePts[idx[t.id]] = t.pts; baseGd[idx[t.id]] = t.gd; baseGf[idx[t.id]] = t.gf; });

  const rem = fixtures.filter(f =>
    f.state !== "post" && idx[f.homeId] !== undefined && idx[f.awayId] !== undefined);
  const remH = new Int32Array(rem.length), remA = new Int32Array(rem.length);
  rem.forEach((f,i) => { remH[i] = idx[f.homeId]; remA[i] = idx[f.awayId]; });

  const eloArr = new Float64Array(n);
  ids.forEach((id,i) => { eloArr[i] = elo[id]; });

  // 남은 경기가 적을수록 팀 실력의 불확실성도 작아진다
  const maxGp = Math.max.apply(null, current.map(t => t.gp));
  const sd = CFG.strengthSdBase + CFG.strengthSdSpan * Math.max(0, 1 - maxGp / 38);
  const jitter = new Float64Array(n);
  const adjH = new Float64Array(n), adjA = new Float64Array(n);

  const rankSum   = new Float64Array(n);
  const top5Count = new Float64Array(n);
  const rankHist  = Array.from({length:n}, () => new Float64Array(n + 1));
  const players   = PREDICTIONS.map(p => ({
    name: p.name,
    idxs: p.picks.map(id => idx[id]),
    sum: 0, wins: 0, hist: new Float64Array(31)
  }));

  const pts = new Float64Array(n), gd = new Float64Array(n), gf = new Float64Array(n);
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  const cmp = (x,y) => pts[y] - pts[x] || gd[y] - gd[x] || gf[y] - gf[x];
  const rankOfIdx = new Int32Array(n);
  const CHUNK = 400;
  let run = 0;

  function step(){
    const stop = Math.min(run + CHUNK, runs);
    for (; run < stop; run++){
      pts.set(basePts); gd.set(baseGd); gf.set(baseGf);
      // 이번 시즌의 '진짜 실력'을 한 번 뽑는다 (런 내내 고정)
      for (let i = 0; i < n; i++){
        jitter[i] = eloArr[i] + gauss() * sd;
        adjH[i] = jitter[i] + CFG.homeAdv;
      }
      for (let i = 0; i < n; i++) adjA[i] = jitter[i];
      for (let i = 0; i < remH.length; i++){
        const h = remH[i], a = remA[i];
        const ti = drIndex(adjH[h] - adjA[a]);
        const r = Math.random();
        if (r < TBL_W[ti]){
          const g = sampleMargin();
          pts[h] += 3; gd[h] += g; gd[a] -= g; gf[h] += g;
        } else if (r < TBL_WD[ti]){
          pts[h] += 1; pts[a] += 1; gf[h] += 1; gf[a] += 1;
        } else {
          const g = sampleMargin();
          pts[a] += 3; gd[a] += g; gd[h] -= g; gf[a] += g;
        }
      }
      for (let i = 0; i < n; i++) order[i] = i;
      order.sort(cmp);
      for (let r2 = 0; r2 < n; r2++){
        const ti = order[r2], rk = r2 + 1;
        rankOfIdx[ti] = rk;
        rankSum[ti] += rk;
        rankHist[ti][rk] += 1;
        if (rk <= 5) top5Count[ti] += 1;
      }
      let best = -1;
      for (const p of players){
        let tot = 0;
        for (let k = 0; k < 5; k++) tot += teamPoints(k + 1, rankOfIdx[p.idxs[k]]);
        p.last = tot; p.sum += tot; p.hist[tot] += 1;
        if (tot > best) best = tot;
      }
      const tied = players.filter(p => p.last === best);
      tied.forEach(p => { p.wins += 1 / tied.length; });
    }
    if (onProgress) onProgress(run / runs);
    if (run < runs) setTimeout(step, 0);
    else {
      const teams = current.map(t => {
        const i = idx[t.id];
        let mode = 1, mv = -1;
        for (let r2 = 1; r2 <= n; r2++) if (rankHist[i][r2] > mv){ mv = rankHist[i][r2]; mode = r2; }
        return { id:t.id, expRank: rankSum[i]/runs, top5: top5Count[i]/runs, modeRank: mode };
      });
      // 대표 시나리오 = 기대순위로 줄 세운 최종 순위표
      const finalOrder = teams.slice().sort((a,b) => a.expRank - b.expRank);
      const projRank = {};
      finalOrder.forEach((t,i) => { projRank[t.id] = i + 1; });
      done({
        teams,
        projRank,
        players: players.map(p => ({
          name: p.name, avg: p.sum/runs, winPct: p.wins/runs, hist: Array.from(p.hist)
        }))
      });
    }
  }
  step();
}

/* ============================================================
   7) 상태
   ============================================================ */
const S = { cur:null, prev:null, fixtures:null, elo:null, sim:null, byId:{}, unresolved:[], simBusy:false };
const koName = id => (TEAM_KO[id] ? TEAM_KO[id].ko : ((S.byId[id] || {}).short || id));
const koShort = id => (TEAM_KO[id] ? (TEAM_KO[id].s || TEAM_KO[id].ko) : koName(id));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function resolveTeamId(input){
  const q = norm(input);
  for (const id in TEAM_KO) if (TEAM_KO[id].al.some(a => norm(a) === q)) return id;
  for (const id in S.byId){
    const t = S.byId[id];
    if (norm(t.name) === q || norm(t.short) === q || norm(t.abbr) === q) return id;
  }
  for (const id in TEAM_KO) if (TEAM_KO[id].al.some(a => norm(a).includes(q) || q.includes(norm(a)))) return id;
  return null;
}
function resolvePredictions(){
  S.unresolved = [];
  return PREDICTIONS.map(p => {
    const picks = p.picks.map(raw => {
      const id = resolveTeamId(raw);
      if (!id) S.unresolved.push(p.name + ": " + raw);
      return id;
    });
    return { name: p.name, picks, raw: p.picks };
  });
}

  const players = resolvePredictions();

  const live = rankPlayers(players.map(p => Object.assign({name:p.name, picks:p.picks}, scoreOne(p, liveRank))));
  let projMap = null;
  if (projRank){
    const proj = rankPlayers(players.map(p => Object.assign({name:p.name}, scoreOne(p, projRank))));
    projMap = {};
    proj.forEach(p => { projMap[p.name] = p; });
  }
  const winMap = {};
  if (S.sim) S.sim.players.forEach(p => { winMap[p.name] = p.winPct; });

  const html = live.map(p => {
    const pr = projMap ? projMap[p.name] : null;
    const move = pr ? p.rank - pr.rank : 0;
    const moveHtml = !pr ? "" :
      (move > 0 ? ' <span class="up">▲' + move + "</span>"
       : move < 0 ? ' <span class="dn">▼' + (-move) + "</span>"
       : ' <span style="color:var(--muted)">—</span>');
    const sub = pr
      ? "마감 예측 " + pr.total + "점 · " + pr.rank + "위" + moveHtml +
        (winMap[p.name] !== undefined ? " · 우승 " + Math.round(winMap[p.name]*100) + "%" : "")
      : "정확히 맞춘 팀 " + p.exact + " · 5위권 적중 " + p.inTop5;

    const strip = p.rows.map(r =>
      '<div class="cell" data-p="' + r.pts + '"><i></i><span>' + esc(koShort(r.teamId)) + "</span></div>"
    ).join("");

    const bd = p.rows.map(r => {
      const act = r.actualRank ? r.actualRank + "위" : "—";
      const diff = r.actualRank && r.actualRank <= 5
        ? (r.actualRank === r.predRank ? "정확" : Math.abs(r.actualRank - r.predRank) + "칸 차")
        : "5위권 밖";
      return '<div class="bd-r"><div class="bd-pos">' + r.predRank + "</div>" +
             '<div class="bd-tm">' + esc(koName(r.teamId)) + "</div>" +
             '<div class="bd-act">' + act + " · " + diff + "</div>" +
             '<div class="bd-pt' + (r.pts ? "" : " z") + '">' + r.pts + "</div></div>";
    }).join("");

    return '<button class="pl' + (p.rank === 1 ? " first" : "") + '" data-nm="' + esc(p.name) + '">' +
      '<div class="pl-top">' +
        '<div class="rk num">' + p.rank + "</div>" +
        '<div class="pl-id"><div class="pl-name">' + esc(p.name) + "</div>" +
          '<div class="pl-sub num">' + sub + "</div></div>" +
        '<div class="pl-score"><div class="sc-now num">' + p.total + "</div>" +
          (pr ? '<div class="sc-fin num">→ ' + pr.total + "</div>" : "") +
        "</div>" +
      "</div>" +
      '<div class="strip">' + strip + "</div>" +
      '<div class="bd">' + bd +
        '<div class="bd-sum"><span>정확 ' + p.exact + "개 · 5위권 " + p.inTop5 + "개</span><span>합계 " + p.total + " / 30</span></div>" +
      "</div></button>";
  }).join("");

  document.getElementById("lb-body").innerHTML = '<div class="lb">' + html + "</div>";
  document.getElementById("lb-note").innerHTML = S.unresolved.length
    ? '<span style="color:var(--coral)">팀 이름을 찾지 못했습니다 — ' + esc(S.unresolved.join(", ")) + "</span>"
    : "칸은 왼쪽부터 1위~5위 예측이고, 색이 진할수록 그 팀에서 많이 벌었습니다. " +
      "행을 누르면 팀별 득점 내역이 펼쳐집니다. 팀당 최대 6점, 5팀 합계 30점 만점." +
      (S.sim ? "" : " 예측 탭에서 시뮬레이션을 돌리면 마감 예측 점수가 함께 표시됩니다.");

  document.querySelectorAll(".pl").forEach(el => {
    el.addEventListener("click", () => el.classList.toggle("open"));
  });
}

    '<h2 class="sec">팀별 5위 안 진입 확률</h2><div class="prob">' + teamHtml + "</div>" +
    '<h2 class="sec">대표 마감 시나리오</h2><p class="note num">' + esc(proj) + "</p>" +
    '<button class="run" id="run">다시 돌리기</button><div class="prog" id="prog"><i></i></div>';
  document.getElementById("run").addEventListener("click", runSim);
}

async function runSim(){
  if (S.simBusy) return;
  S.simBusy = true;
  const btn = document.getElementById("run");
  const prog = document.getElementById("prog");
  const bar = prog.querySelector("i");
  btn.disabled = true; prog.classList.add("on");

  try{
    btn.textContent = "일정을 불러오는 중";
    if (!S.fixtures) S.fixtures = await fetchAllFixtures((a,b) => { bar.style.width = (a/b*35) + "%"; });
    if (!S.prev) S.prev = await fetchStandings(CFG.prevSeason);
    S.elo = applyPlayedMatches(buildElo(S.prev, S.cur), S.fixtures);

    btn.textContent = "시뮬레이션 중";
    const players = resolvePredictions();
    PREDICTIONS.forEach((p,i) => { p.picks = players[i].picks; });  // id로 치환
    await new Promise(res => {
      simulate(S.cur, S.fixtures, S.elo, CFG.simRuns,
        f => { bar.style.width = (35 + f*65) + "%"; },
        out => { S.sim = out; res(); });
    });
    PREDICTIONS.forEach((p,i) => { p.picks = players[i].raw; });     // 원래 이름 복구
    renderForecast();
    renderLeaderboard();
  }catch(e){
    document.getElementById("fc-body").innerHTML =
      '<div class="msg err">시뮬레이션에 실패했습니다 — ' + esc(e.message) + "</div>";
  }finally{
    S.simBusy = false;
  }
}

async function openTeam(id){
  const sheet = document.getElementById("sheet");
  const box = document.getElementById("sheet-in");
  const t = S.byId[id] || {};
  sheet.classList.add("on");
  box.innerHTML =
    '<div class="sheet-hd">' + (t.logo ? '<img src="' + t.logo + '" alt="">' : "") +
    "<h3>" + esc(koName(id)) + '</h3><button class="x" id="x">×</button></div>' +
    '<div class="msg">선수단을 불러오는 중</div>';
  document.getElementById("x").addEventListener("click", closeSheet);

  try{
    const [rosterRaw, schedRaw] = await Promise.all([
      getJSON(API + "/site/v2/sports/soccer/eng.1/teams/" + id + "/roster"),
      getJSON(API + "/site/v2/sports/soccer/eng.1/teams/" + id + "/schedule").catch(() => ({events:[]}))
    ]);
    const groups = rosterRaw.athletes || [];
    const flat = groups.length && groups[0].items
      ? groups.flatMap(g => g.items.map(p => Object.assign({_g:g.position}, p)))
      : groups;
    const squad = flat.map(p =>
      '<div class="sq"><div class="sq-j num">' + esc(p.jersey || "-") + "</div>" +
      '<div class="sq-n">' + esc(p.displayName || p.fullName || "") + "</div>" +
      '<div class="sq-p num">' + esc(((p.position||{}).abbreviation) || "") +
        (p.age ? " · " + p.age + "세" : "") + "</div></div>"
    ).join("") || '<div class="msg">선수 정보가 없습니다</div>';

    // 시즌 전체 일정을 이미 받아 뒀으면 그걸 쓰고(예정 경기까지 보인다),
    // 아니면 팀 일정 API 결과를 쓴다. 여기서 실패해도 선수단은 보여야 한다.
    let rows = [];
    try{
    if (S.fixtures){
      const mine = S.fixtures.filter(f => f.homeId === id || f.awayId === id);
      const done = mine.filter(f => f.state === "post").slice(-3);
      const soon = mine.filter(f => f.state !== "post").slice(0, 4);
      rows = done.concat(soon).map(f => ({
        date: f.date, post: f.state === "post",
        h: f.homeId, a: f.awayId, hs: f.homeScore, as: f.awayScore
      }));
    } else {
      rows = (schedRaw.events || []).slice(-6).map(ev => {
        const c = (ev.competitions || [])[0];
        if (!c) return null;
        const h = c.competitors.find(x => x.homeAway === "home");
        const a = c.competitors.find(x => x.homeAway === "away");
        if (!h || !a) return null;
        return {
          date: ev.date, post: evState(ev, c) === "post",
          h: String(h.team.id), a: String(a.team.id),
          hs: compScore(h), as: compScore(a)
        };
      }).filter(Boolean);
    }
    }catch(err){ rows = []; }
    const sched = rows.map(r => {
      const d = new Date(r.date);
      return '<div class="fx"><div class="fx-t r">' + esc(koName(r.h)) + "</div>" +
        '<div class="fx-s' + (r.post ? "" : " sched") + ' num">' +
        (r.post ? r.hs + " : " + r.as : (d.getMonth()+1) + "/" + d.getDate()) + "</div>" +
        '<div class="fx-t">' + esc(koName(r.a)) + "</div></div>";
    }).join("") || '<div class="msg">경기 정보가 없습니다</div>';

    box.innerHTML =
      '<div class="sheet-hd">' + (t.logo ? '<img src="' + t.logo + '" alt="">' : "") +
      "<h3>" + esc(koName(id)) + '</h3><button class="x" id="x">×</button></div>' +
      '<h2 class="sec">최근 · 예정 경기</h2>' + sched +
      '<h2 class="sec">선수단 ' + flat.length + "명</h2>" + squad;
    document.getElementById("x").addEventListener("click", closeSheet);
  }catch(e){
    box.insertAdjacentHTML("beforeend",
      '<div class="msg err">선수단을 불러오지 못했습니다 — ' + esc(e.message) + "</div>");
  }
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); }
document.getElementById("sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ============================================================
   9) 탭
   ============================================================ */
let fxLoading = false;
document.getElementById("tabs").addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.getElementById("v-" + btn.dataset.v).classList.add("on");
  window.scrollTo(0, 0);

  if (btn.dataset.v === "fx" && !S.fixtures && !fxLoading){
    fxLoading = true;
    const body = document.getElementById("fx-body");
    body.innerHTML = '<div class="msg">경기 일정을 불러오는 중</div>';
    try{
      S.fixtures = await fetchAllFixtures();
      renderFixtures();
    }catch(err){
      body.innerHTML = '<div class="msg err">일정을 불러오지 못했습니다 — ' + esc(err.message) + "</div>";
    }
    fxLoading = false;
  }
  if (btn.dataset.v === "fc") renderForecast();
});

/* ============================================================
   10) 부팅
   ============================================================ */
async function boot(){
  try{
    S.cur = await fetchStandings(CFG.season);
    S.cur.forEach(t => { S.byId[t.id] = t; });
    const gp = Math.max.apply(null, S.cur.map(t => t.gp));
    const now = new Date();
    document.getElementById("meta").innerHTML =
      "<b>" + gp + "R</b> · " +
      String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + " 기준";
    renderLeaderboard();
    renderTable();
  }catch(e){
    const isFile = location.protocol === "file:";
    const html = isFile
      ? '<div class="msg err">이 파일을 직접 열면 순위를 가져올 수 없습니다.' +
        '<br>브라우저 보안 정책 때문이며, 웹 주소(https://…)로 열면 정상 작동합니다.</div>'
      : '<div class="msg err">순위를 불러오지 못했습니다 — ' + esc(e.message) +
        '<button id="retry">다시 시도</button></div>';
    document.getElementById("lb-body").innerHTML = html;
    document.getElementById("meta").textContent = "연결 실패";
    const r = document.getElementById("retry");
    if (r) r.addEventListener("click", () => location.reload());
  }
}
boot();
